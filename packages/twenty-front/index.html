<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/x-icon"
      href="/images/odelza/favicon.ico"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/images/odelza/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#2D120D" />
    <meta name="application-name" content="Odelza" />
    <meta name="apple-mobile-web-app-title" content="Odelza" />
    <meta
      name="description"
      content="Tu espacio de trabajo para clientes, proyectos y operaciones"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Odelza" />
    <meta property="og:title" content="Odelza" />
    <meta
      property="og:description"
      content="Tu espacio de trabajo para clientes, proyectos y operaciones"
    />
    <meta property="og:image" content="/images/odelza/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Odelza" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Odelza" />
    <meta
      name="twitter:description"
      content="Tu espacio de trabajo para clientes, proyectos y operaciones"
    />
    <meta name="twitter:image" content="/images/odelza/social-card.png" />
    <title>Odelza</title>
    <!-- BEGIN: Odelza Config -->
    <script id="odelza-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Odelza Config -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* ODELZA_THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1a0c09;
        /* ODELZA_THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fffbf0;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
