name: CI Twenty Apps

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/deploy-twenty-app/action.yml
      - .github/actions/install-twenty-app/action.yml
      - .github/actions/restore-cache/action.yaml
      - .github/actions/spawn-twenty-app-dev-test/action.yml
      - .github/actions/spawn-twenty-server/action.yml
      - .github/actions/test-twenty-app/action.yml
      - .github/actions/yarn-install/action.yaml
      - .github/workflows/changed-files.yaml
      - .github/workflows/ci-twenty-apps.yaml
      - .github/workflows/discover-apps.yaml
      - .nvmrc
      - .yarnrc.yml
      - .yarn/**
      - package.json
      - tsconfig.base.json
      - nx.json
      - yarn.config.cjs
      - yarn.lock
      - packages/twenty-apps/internal/**
      - packages/twenty-apps/public/**
      - packages/twenty-emails/**
      - packages/twenty-server/**
      - packages/twenty-shared/**
  pull_request:
    paths:
      - .github/actions/deploy-twenty-app/action.yml
      - .github/actions/install-twenty-app/action.yml
      - .github/actions/restore-cache/action.yaml
      - .github/actions/spawn-twenty-app-dev-test/action.yml
      - .github/actions/spawn-twenty-server/action.yml
      - .github/actions/test-twenty-app/action.yml
      - .github/actions/yarn-install/action.yaml
      - .github/workflows/changed-files.yaml
      - .github/workflows/ci-twenty-apps.yaml
      - .github/workflows/discover-apps.yaml
      - .nvmrc
      - .yarnrc.yml
      - .yarn/**
      - package.json
      - tsconfig.base.json
      - nx.json
      - yarn.config.cjs
      - yarn.lock
      - packages/twenty-apps/internal/**
      - packages/twenty-apps/public/**
      - packages/twenty-emails/**
      - packages/twenty-server/**
      - packages/twenty-shared/**
  workflow_dispatch:
    inputs:
      application:
        description: 'App folder name to test (e.g. "twenty-linear"). Leave empty to test all apps.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  app-changed-files-check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/twenty-apps/internal/**
        packages/twenty-apps/public/**

  shared-changed-files-check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        .github/actions/deploy-twenty-app/action.yml
        .github/actions/install-twenty-app/action.yml
        .github/actions/restore-cache/action.yaml
        .github/actions/spawn-twenty-app-dev-test/action.yml
        .github/actions/spawn-twenty-server/action.yml
        .github/actions/test-twenty-app/action.yml
        .github/actions/yarn-install/action.yaml
        .github/workflows/changed-files.yaml
        .github/workflows/ci-twenty-apps.yaml
        .github/workflows/discover-apps.yaml
        .nvmrc
        .yarnrc.yml
        .yarn/**
        package.json
        tsconfig.base.json
        nx.json
        yarn.config.cjs
        yarn.lock
        packages/twenty-emails/**
        packages/twenty-server/**
        packages/twenty-shared/**

  discover:
    needs: [app-changed-files-check, shared-changed-files-check]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      (needs.app-changed-files-check.result == 'success' &&
      needs.shared-changed-files-check.result == 'success'))
    uses: ./.github/workflows/discover-apps.yaml
    with:
      scope: internal-and-public
      changed-only: >-
        ${{ github.event_name != 'pull_request' && true ||
        needs.shared-changed-files-check.outputs.any_changed != 'true' }}
      application: ${{ inputs.application }}

  ci:
    needs: discover
    if: needs.discover.outputs.has_apps == 'true'
    name: ${{ matrix.app.name }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.app.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: ${{ matrix.app.path }}/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        if: matrix.app.hasTypecheck
        run: yarn typecheck

      - name: Unit tests
        if: matrix.app.hasUnit
        run: yarn test:unit

  # Keep local coverage on PRs; external-image coverage remains on main/manual runs.
  prepare-integration-matrix:
    needs: discover
    if: needs.discover.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Exclude unreliable DockerHub fixtures
        id: set-matrix
        env:
          APPS: ${{ needs.discover.outputs.matrix }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const apps = JSON.parse(process.env.APPS);
          const isPullRequest = process.env.EVENT_NAME === 'pull_request';
          const excludedDockerHubApps = new Set([
            'self-hosting',
            'twenty-partners',
            'people-data-labs',
            'twenty-last-contact',
          ]);
          const serverSources = isPullRequest
            ? ['local']
            : ['dockerhub-latest', 'local'];
          const matrix = {
            include: apps.flatMap((app) =>
              serverSources
                .filter(
                  (serverSource) =>
                    serverSource === 'local' ||
                    !excludedDockerHubApps.has(app.name),
                )
                .map((serverSource) => ({
                  app,
                  'server-source': serverSource,
                })),
            ),
          };
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify(matrix)}\n`,
          );
          NODE

  integration:
    needs: [discover, prepare-integration-matrix]
    if: needs.discover.outputs.has_apps == 'true'
    name: ${{ matrix.app.name }} (${{ matrix.server-source }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-integration-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10

      - name: Spawn Twenty server
        id: twenty
        if: matrix.app.hasIntegration
        uses: ./.github/actions/spawn-twenty-server
        with:
          source: ${{ matrix.server-source }}

      - name: Test app against server
        if: matrix.app.hasIntegration
        uses: ./.github/actions/test-twenty-app
        with:
          api-url: ${{ steps.twenty.outputs.server-url }}
          api-key: ${{ steps.twenty.outputs.api-key }}
          app-path: ${{ matrix.app.path }}
          mode: ${{ matrix.server-source == 'local' && 'installation-and-integration-test' || 'integration-test-only' }}

  ci-twenty-apps-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      [
        app-changed-files-check,
        shared-changed-files-check,
        discover,
        ci,
        prepare-integration-matrix,
        integration,
      ]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
