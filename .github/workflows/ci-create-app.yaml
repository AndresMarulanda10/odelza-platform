name: CI Create App

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/nx-affected/action.yaml
      - .github/actions/yarn-install/action.yaml
      - .github/workflows/changed-files.yaml
      - .github/workflows/ci-create-app.yaml
      - .nvmrc
      - .yarnrc.yml
      - .yarn/**
      - package.json
      - tsconfig.base.json
      - nx.json
      - yarn.config.cjs
      - yarn.lock
      - packages/create-twenty-app/**
      - packages/twenty-sdk/**
      - packages/twenty-shared/**

  pull_request:
    paths:
      - .github/actions/nx-affected/action.yaml
      - .github/actions/yarn-install/action.yaml
      - .github/workflows/changed-files.yaml
      - .github/workflows/ci-create-app.yaml
      - .nvmrc
      - .yarnrc.yml
      - .yarn/**
      - package.json
      - tsconfig.base.json
      - nx.json
      - yarn.config.cjs
      - yarn.lock
      - packages/create-twenty-app/**
      - packages/twenty-sdk/**
      - packages/twenty-shared/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        .github/actions/nx-affected/action.yaml
        .github/actions/yarn-install/action.yaml
        .github/workflows/changed-files.yaml
        .github/workflows/ci-create-app.yaml
        .nvmrc
        .yarnrc.yml
        .yarn/**
        package.json
        tsconfig.base.json
        nx.json
        yarn.config.cjs
        yarn.lock
        packages/create-twenty-app/**
        packages/twenty-sdk/**
        packages/twenty-shared/**
  create-app-test:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [lint, typecheck, test]
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build
        run: npx nx build create-twenty-app
      - name: Run ${{ matrix.task }} task
        uses: ./.github/actions/nx-affected
        with:
          tag: scope:create-app
          tasks: ${{ matrix.task }}
  ci-create-app-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, create-app-test]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
