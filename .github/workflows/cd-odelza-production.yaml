name: Odelza production CD

on:
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/cd-odelza-production.yaml'
      - '.yarn/**'
      - '.yarnrc.yml'
      - 'nx.json'
      - 'package.json'
      - 'scripts/odelza-production-deploy.sh'
      - 'tsconfig.base.json'
      - 'yarn.lock'
      - 'packages/twenty-client-sdk/**'
      - 'packages/twenty-docker/**'
      - 'packages/twenty-emails/**'
      - 'packages/twenty-front-component-renderer/**'
      - 'packages/twenty-front/**'
      - 'packages/twenty-sdk/**'
      - 'packages/twenty-server/**'
      - 'packages/twenty-shared/**'
      - 'packages/twenty-ui/**'
  workflow_dispatch:
    inputs:
      allow_upgrade_path:
        description: 'Explicitly approve deployment when database or workspace upgrade paths changed.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: odelza-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Odelza production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://second-brain.odelza.com/
    env:
      ODELZA_DEPLOY_HOST: ${{ secrets.ODELZA_DEPLOY_HOST }}
      ODELZA_DEPLOY_PORT: ${{ secrets.ODELZA_DEPLOY_PORT }}
      ODELZA_DEPLOY_USER: ${{ secrets.ODELZA_DEPLOY_USER }}
      ODELZA_DEPLOY_SSH_KEY: ${{ secrets.ODELZA_DEPLOY_SSH_KEY }}
      ODELZA_DEPLOY_KNOWN_HOSTS: ${{ secrets.ODELZA_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate production inputs
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          ALLOW_UPGRADE_PATH: ${{ inputs.allow_upgrade_path }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            printf 'Manual production dispatch must target the main branch; selected ref: %s\n' "$GITHUB_REF" >&2
            exit 1
          fi

          missing=0
          for variable_name in \
            ODELZA_DEPLOY_HOST \
            ODELZA_DEPLOY_PORT \
            ODELZA_DEPLOY_USER \
            ODELZA_DEPLOY_SSH_KEY \
            ODELZA_DEPLOY_KNOWN_HOSTS; do
            case "$variable_name" in
              ODELZA_DEPLOY_HOST) variable_value="${ODELZA_DEPLOY_HOST:-}" ;;
              ODELZA_DEPLOY_PORT) variable_value="${ODELZA_DEPLOY_PORT:-}" ;;
              ODELZA_DEPLOY_USER) variable_value="${ODELZA_DEPLOY_USER:-}" ;;
              ODELZA_DEPLOY_SSH_KEY) variable_value="${ODELZA_DEPLOY_SSH_KEY:-}" ;;
              ODELZA_DEPLOY_KNOWN_HOSTS) variable_value="${ODELZA_DEPLOY_KNOWN_HOSTS:-}" ;;
            esac
            if [[ -z "$variable_value" ]]; then
              printf 'Missing required production environment secret: %s\n' "$variable_name" >&2
              missing=1
            fi
          done
          if (( missing )); then
            exit 1
          fi

          if [[ ! "$ODELZA_DEPLOY_PORT" =~ ^[0-9]+$ ]] ||
             (( ODELZA_DEPLOY_PORT < 1 || ODELZA_DEPLOY_PORT > 65535 )); then
            printf '%s\n' 'ODELZA_DEPLOY_PORT must be a TCP port number.' >&2
            exit 1
          fi

          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'GITHUB_SHA is not a full commit SHA; refusing a mutable image tag.' >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$PUSH_BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              changed_files="$(git log --name-only --format= "$GITHUB_SHA")"
            else
              changed_files="$(git log --name-only --format= "$PUSH_BEFORE..$GITHUB_SHA")"
            fi
          else
            printf '%s\n' 'Manual dispatch checks only the selected commit against its first parent.' >&2
            changed_files="$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA")"
          fi

          production_compose_path='packages/twenty-docker/docker-compose.yml'
          if grep -Fqx "$production_compose_path" <<<"$changed_files"; then
            printf '%s\n' 'Production Compose changed in the triggering commit; refusing automatic CD.' >&2
            printf '%s\n' 'Apply production Compose changes through a separate guarded operational change.' >&2
            exit 1
          fi

          migration_change=''
          while IFS= read -r changed_path; do
            case "$changed_path" in
              packages/twenty-server/src/database/migrations/*|packages/twenty-server/src/database/commands/upgrade-version-command/*)
                migration_change="$changed_path"
                break
                ;;
            esac
          done <<<"$changed_files"
          if [[ -n "$migration_change" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$ALLOW_UPGRADE_PATH" != true ]]; then
              printf 'Database/upgrade path changed: %s\n' "$migration_change" >&2
              printf '%s\n' 'Automatic CD is disabled. Use manual dispatch with explicit upgrade-path approval.' >&2
              exit 1
            fi

            printf 'Manual upgrade-path deployment explicitly approved for: %s\n' "$migration_change"
          fi

      - name: Build immutable production image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="twentycrm/twenty:odelza-${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --target twenty \
            --tag "$image_ref" \
            --file packages/twenty-docker/twenty/Dockerfile \
            --load \
            .

          mkdir -p "$RUNNER_TEMP/odelza-cd"
          image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          printf '%s\n' "$image_id" >"$RUNNER_TEMP/odelza-cd/image-id"
          chmod 600 "$RUNNER_TEMP/odelza-cd/image-id"
          image_archive="$RUNNER_TEMP/odelza-cd/image.tar.gz"
          docker save "$image_ref" | gzip -c >"$image_archive"

          manifest_file="$RUNNER_TEMP/odelza-cd/manifest.json"
          config_file="$RUNNER_TEMP/odelza-cd/image-config.json"
          tar -xOzf "$image_archive" manifest.json >"$manifest_file"
          config_member="$(sed -n 's/.*"Config"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest_file")"
          case "$config_member" in
            ''|*..*|/*|*[!ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._:/-]*)
              printf '%s\n' 'docker save manifest contains an invalid config member.' >&2
              exit 1
              ;;
          esac
          tar -xOzf "$image_archive" "$config_member" >"$config_file"
          image_config_digest="sha256:$(sha256sum "$config_file" | awk '{print $1}')"
          printf '%s\n' "$image_config_digest" >"$RUNNER_TEMP/odelza-cd/image-config-digest"
          chmod 600 "$RUNNER_TEMP/odelza-cd/image-config-digest"
          rm -f "$manifest_file" "$config_file"

      - name: Transfer and activate image over SSH
        shell: bash
        run: |
          set -euo pipefail

          key_file="$RUNNER_TEMP/odelza-cd/deploy-key"
          known_hosts_file="$RUNNER_TEMP/odelza-cd/known-hosts"
          remote_dir="/tmp/odelza-cd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_script="$remote_dir/odelza-production-deploy.sh"
          remote_archive="$remote_dir/image.tar.gz"
          image_ref="twentycrm/twenty:odelza-${GITHUB_SHA}"
          image_id="$(<"$RUNNER_TEMP/odelza-cd/image-id")"
          image_config_digest="$(<"$RUNNER_TEMP/odelza-cd/image-config-digest")"

          printf '%s\n' "$ODELZA_DEPLOY_SSH_KEY" >"$key_file"
          printf '%s\n' "$ODELZA_DEPLOY_KNOWN_HOSTS" >"$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          ssh_options=(
            -i "$key_file"
            -p "$ODELZA_DEPLOY_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
          )
          scp_options=(
            -i "$key_file"
            -P "$ODELZA_DEPLOY_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
          )
          remote_target="${ODELZA_DEPLOY_USER}@${ODELZA_DEPLOY_HOST}"

          cleanup() {
            set +e
            ssh "${ssh_options[@]}" "$remote_target" "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true
            rm -f "$key_file" "$known_hosts_file" \
              "$RUNNER_TEMP/odelza-cd/image-id" \
              "$RUNNER_TEMP/odelza-cd/image-config-digest" \
              "$RUNNER_TEMP/odelza-cd/image.tar.gz"
          }
          trap cleanup EXIT

          ssh "${ssh_options[@]}" "$remote_target" "umask 077 && mkdir -p -- '$remote_dir'"
          scp "${scp_options[@]}" scripts/odelza-production-deploy.sh \
            "$remote_target:$remote_script"
          scp "${scp_options[@]}" "$RUNNER_TEMP/odelza-cd/image.tar.gz" \
            "$remote_target:$remote_archive"
          ssh "${ssh_options[@]}" "$remote_target" \
            "sh '$remote_script' --image-archive '$remote_archive' --image-ref '$image_ref' --local-image-id '$image_id' --image-config-digest '$image_config_digest'"

      - name: Verify public production health
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-connrefused \
            --output /dev/null \
            --write-out 'public_healthz=%{http_code}\n' \
            https://second-brain.odelza.com/healthz
