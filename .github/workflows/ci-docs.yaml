name: CI Docs

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/yarn-install/action.yaml
      - .github/workflows/changed-files.yaml
      - .github/workflows/ci-docs.yaml
      - .nvmrc
      - .yarnrc.yml
      - .yarn/**
      - package.json
      - tsconfig.base.json
      - nx.json
      - yarn.config.cjs
      - yarn.lock
      - packages/twenty-docs/**
      - packages/twenty-oxlint-rules/**

  pull_request:
    paths:
      - .github/actions/yarn-install/action.yaml
      - .github/workflows/changed-files.yaml
      - .github/workflows/ci-docs.yaml
      - .nvmrc
      - .yarnrc.yml
      - .yarn/**
      - package.json
      - tsconfig.base.json
      - nx.json
      - yarn.config.cjs
      - yarn.lock
      - packages/twenty-docs/**
      - packages/twenty-oxlint-rules/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        .github/actions/yarn-install/action.yaml
        .github/workflows/changed-files.yaml
        .github/workflows/ci-docs.yaml
        .nvmrc
        .yarnrc.yml
        .yarn/**
        package.json
        tsconfig.base.json
        nx.json
        yarn.config.cjs
        yarn.lock
        packages/twenty-docs/**
        packages/twenty-oxlint-rules/**

  docs-lint:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Fetch local actions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Docs / Lint
        run: npx nx lint twenty-docs
